# Test Workflow: lint, unit tests and an unpacked packaging check.
name: Test

# Runs before every release (called by build-release.yml with the release commit) and on demand.
# Pull requests and pushes do not start it.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to verify; defaults to the triggering commit.
        type: string
        required: false
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code 🛎️
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js 🐍
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies 📦
        run: npm ci

      - name: Lint ✨
        run: npm run lint

      - name: Test 🧪
        run: npm test

  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Verify unpacked desktop package
        run: npx --no-install electron-builder --dir --publish never --config.directories.output=out/package-check
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
