# Test Workflow: Runs lint and unit tests on every push and pull request to main
name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code 🛎️
        uses: actions/checkout@v6

      - name: Setup Node.js 🐍
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies 📦
        run: npm ci

      - name: Lint ✨
        run: npm run lint

      - name: Test 🧪
        run: npm test

  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Verify unpacked desktop package
        run: npx --no-install electron-builder --dir --publish never --config.directories.output=out/package-check
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
